<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1150" width="1500" height="1150">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="nt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="prima-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <linearGradient id="term-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <linearGradient id="ret-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>

    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c" />
    </marker>
    
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#38bdf8">Árbol Estructural Completo de la Gramática de Expresiones</text>
    <text x="0" y="30" font-family="Segoe UI, sans-serif" font-size="16" fill="#94a3b8">Lenguaje: GatoSabe | Sección 9: Expresiones Aritméticas (GLC)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 95)" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0">
    <rect x="0" y="0" width="20" height="14" rx="3" fill="url(#nt-grad)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="28" y="12">No Terminales Principales</text>

    <rect x="230" y="0" width="20" height="14" rx="3" fill="url(#prima-grad)" stroke="#818cf8" stroke-width="1.5" />
    <text x="258" y="12">No Terminales de Continuación (_P)</text>

    <rect x="520" y="0" width="20" height="14" rx="3" fill="url(#term-grad)" stroke="#34d399" stroke-width="1.5" />
    <text x="548" y="12">Terminales / Operandos</text>

    <rect x="740" y="0" width="20" height="14" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1.5" />
    <text x="768" y="12">Épsilon 'e' (Fin de rama)</text>

    <rect x="960" y="0" width="20" height="14" rx="3" fill="url(#ret-grad)" stroke="#fb923c" stroke-width="1.5" />
    <text x="988" y="12">Retorno de Paréntesis</text>
  </g>

  <!-- Separator Line -->
  <line x1="50" y1="130" x2="1450" y2="130" stroke="#334155" stroke-width="1.5" />

  <!-- CONNECTOR LINES -->
  <!-- EXP to TERM and EXP_P -->
  <path d="M 620 225 L 360 275" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />
  <path d="M 780 225 L 1020 275" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />

  <!-- EXP_P to branches -->
  <path d="M 1020 335 L 860 400" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 1090 335 L 1100 400" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 1160 335 L 1310 400" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="2" marker-end="url(#arrow-gray)" fill="none" />

  <!-- TERM to POT and TERM_P -->
  <path d="M 300 335 L 200 400" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />
  <path d="M 400 335 L 530 400" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />

  <!-- TERM_P to branches -->
  <path d="M 490 460 L 410 525" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 550 460 L 590 525" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 610 460 L 730 525" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="2" marker-end="url(#arrow-gray)" fill="none" />

  <!-- POT to VALOR and POT_P -->
  <path d="M 170 460 L 130 525" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />
  <path d="M 230 460 L 275 525" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />

  <!-- POT_P to branches -->
  <path d="M 260 585 L 210 650" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 310 585 L 340 650" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="2" marker-end="url(#arrow-gray)" fill="none" />

  <!-- VALOR to all primitive values -->
  <path d="M 100 585 C 80 630 60 700 60 760" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 110 585 C 100 630 160 700 160 760" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 120 585 C 130 630 260 700 260 760" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 130 585 C 150 630 360 700 360 760" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 140 585 C 170 630 470 700 470 760" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 150 585 C 200 630 610 700 610 760" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 160 585 C 240 630 800 700 800 760" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrow-orange)" fill="none" />

  <!-- PARENTHESIS CYCLE BACK TO EXP -->
  <path d="M 880 815 C 1100 950 1440 700 1440 350 C 1440 160 980 140 820 180" 
        stroke="#fb923c" stroke-dasharray="8 6" stroke-width="3" marker-end="url(#arrow-orange)" fill="none" />
  
  <text x="1310" y="470" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#fb923c" transform="rotate(90 1310 470)">
    ( Retorno Prioritario: Reinicia EXP )
  </text>


  <!-- NODES -->

  <!-- LEVEL 0: ROOT EXP -->
  <g transform="translate(580, 165)" filter="url(#shadow)">
    <rect width="240" height="60" rx="10" fill="url(#nt-grad)" stroke="#60a5fa" stroke-width="2.5" />
    <text x="120" y="30" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">EXP</text>
    <text x="120" y="50" font-family="Segoe UI, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Expresión Aritmética Raíz</text>
  </g>

  <!-- LEVEL 1: TERM & EXP_P -->
  <g transform="translate(260, 275)" filter="url(#shadow)">
    <rect width="200" height="60" rx="10" fill="url(#nt-grad)" stroke="#60a5fa" stroke-width="2" />
    <text x="100" y="30" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">TERM</text>
    <text x="100" y="50" font-family="Segoe UI, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Término de la Expresión</text>
  </g>

  <g transform="translate(980, 275)" filter="url(#shadow)">
    <rect width="240" height="60" rx="10" fill="url(#prima-grad)" stroke="#818cf8" stroke-width="2" />
    <text x="120" y="30" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">EXP_P</text>
    <text x="120" y="50" font-family="Segoe UI, sans-serif" font-size="12" fill="#c7d2fe" text-anchor="middle">¿Más Sumas (+) o Restas (-)?</text>
  </g>

  <!-- EXP_P BRANCHES -->
  <g transform="translate(750, 400)" filter="url(#shadow)">
    <rect width="210" height="55" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
    <text x="105" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#a5b4fc" text-anchor="middle">OPA+ (+)</text>
    <text x="105" y="44" font-family="Segoe UI, sans-serif" font-size="12" fill="#e0e7ff" text-anchor="middle">TERM  ➔  EXP_P</text>
  </g>

  <g transform="translate(990, 400)" filter="url(#shadow)">
    <rect width="210" height="55" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
    <text x="105" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#a5b4fc" text-anchor="middle">OPA- (-)</text>
    <text x="105" y="44" font-family="Segoe UI, sans-serif" font-size="12" fill="#e0e7ff" text-anchor="middle">TERM  ➔  EXP_P</text>
  </g>

  <g transform="translate(1230, 400)" filter="url(#shadow)">
    <rect width="180" height="55" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.8" />
    <text x="90" y="25" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1" text-anchor="middle">e (Épsilon)</text>
    <text x="90" y="44" font-family="Segoe UI, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Fin de Sumas / Restas</text>
  </g>

  <!-- LEVEL 2: POT & TERM_P -->
  <g transform="translate(110, 400)" filter="url(#shadow)">
    <rect width="180" height="60" rx="10" fill="url(#nt-grad)" stroke="#60a5fa" stroke-width="2" />
    <text x="90" y="30" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">POT</text>
    <text x="90" y="50" font-family="Segoe UI, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Nivel de Potencia</text>
  </g>

  <g transform="translate(460, 400)" filter="url(#shadow)">
    <rect width="220" height="60" rx="10" fill="url(#prima-grad)" stroke="#818cf8" stroke-width="2" />
    <text x="110" y="30" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">TERM_P</text>
    <text x="110" y="50" font-family="Segoe UI, sans-serif" font-size="12" fill="#c7d2fe" text-anchor="middle">¿Más Prod (*) o Div (/)?</text>
  </g>

  <!-- TERM_P BRANCHES -->
  <g transform="translate(320, 525)" filter="url(#shadow)">
    <rect width="180" height="55" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
    <text x="90" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#a5b4fc" text-anchor="middle">OPA* (*)</text>
    <text x="90" y="44" font-family="Segoe UI, sans-serif" font-size="12" fill="#e0e7ff" text-anchor="middle">POT  ➔  TERM_P</text>
  </g>

  <g transform="translate(515, 525)" filter="url(#shadow)">
    <rect width="180" height="55" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
    <text x="90" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#a5b4fc" text-anchor="middle">OPA/ (/)</text>
    <text x="90" y="44" font-family="Segoe UI, sans-serif" font-size="12" fill="#e0e7ff" text-anchor="middle">POT  ➔  TERM_P</text>
  </g>

  <g transform="translate(710, 525)" filter="url(#shadow)">
    <rect width="170" height="55" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.8" />
    <text x="85" y="25" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1" text-anchor="middle">e (Épsilon)</text>
    <text x="85" y="44" font-family="Segoe UI, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Fin de Mult / Div</text>
  </g>

  <!-- LEVEL 3: VALOR & POT_P -->
  <g transform="translate(50, 525)" filter="url(#shadow)">
    <rect width="180" height="60" rx="10" fill="url(#nt-grad)" stroke="#60a5fa" stroke-width="2" />
    <text x="90" y="30" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">VALOR</text>
    <text x="90" y="50" font-family="Segoe UI, sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Operando Primitivo</text>
  </g>

  <g transform="translate(240, 525)" filter="url(#shadow)">
    <rect width="160" height="60" rx="10" fill="url(#prima-grad)" stroke="#818cf8" stroke-width="2" />
    <text x="80" y="30" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">POT_P</text>
    <text x="80" y="50" font-family="Segoe UI, sans-serif" font-size="12" fill="#c7d2fe" text-anchor="middle">¿Hay Exponente (^)?</text>
  </g>

  <!-- POT_P BRANCHES -->
  <g transform="translate(150, 650)" filter="url(#shadow)">
    <rect width="140" height="55" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
    <text x="70" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#a5b4fc" text-anchor="middle">OPA^ (^)</text>
    <text x="70" y="44" font-family="Segoe UI, sans-serif" font-size="12" fill="#e0e7ff" text-anchor="middle">➔  POT</text>
  </g>

  <g transform="translate(300, 650)" filter="url(#shadow)">
    <rect width="140" height="55" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.8" />
    <text x="70" y="25" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1" text-anchor="middle">e (Épsilon)</text>
    <text x="70" y="44" font-family="Segoe UI, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Sin exponente</text>
  </g>

  <!-- LEVEL 4: VALOR OPERANDS -->
  <g transform="translate(15, 760)" filter="url(#shadow)">
    <rect width="90" height="55" rx="8" fill="url(#term-grad)" stroke="#34d399" stroke-width="1.8" />
    <text x="45" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">IDV</text>
    <text x="45" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Variable</text>
  </g>

  <g transform="translate(115, 760)" filter="url(#shadow)">
    <rect width="90" height="55" rx="8" fill="url(#term-grad)" stroke="#34d399" stroke-width="1.8" />
    <text x="45" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CNU</text>
    <text x="45" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Número</text>
  </g>

  <g transform="translate(215, 760)" filter="url(#shadow)">
    <rect width="90" height="55" rx="8" fill="url(#term-grad)" stroke="#34d399" stroke-width="1.8" />
    <text x="45" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CAD</text>
    <text x="45" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Cadena</text>
  </g>

  <g transform="translate(315, 760)" filter="url(#shadow)">
    <rect width="90" height="55" rx="8" fill="url(#term-grad)" stroke="#34d399" stroke-width="1.8" />
    <text x="45" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CAR</text>
    <text x="45" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Carácter</text>
  </g>

  <g transform="translate(415, 760)" filter="url(#shadow)">
    <rect width="115" height="55" rx="8" fill="url(#term-grad)" stroke="#34d399" stroke-width="1.8" />
    <text x="57" y="25" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PR20-PR22</text>
    <text x="57" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Booleanos</text>
  </g>

  <g transform="translate(540, 760)" filter="url(#shadow)">
    <rect width="130" height="55" rx="8" fill="url(#term-grad)" stroke="#34d399" stroke-width="1.8" />
    <text x="65" y="25" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">CALL_FUNC</text>
    <text x="65" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Llamada Función</text>
  </g>

  <g transform="translate(685, 760)" filter="url(#shadow)">
    <rect width="210" height="55" rx="8" fill="url(#ret-grad)" stroke="#fb923c" stroke-width="2" />
    <text x="105" y="25" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">CE1 '('  EXP  CE2 ')'</text>
    <text x="105" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#fed7aa" text-anchor="middle">Subexpresión entre Paréntesis</text>
  </g>

</svg>
